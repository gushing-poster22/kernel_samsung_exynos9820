name: Build KernelSU Next for M62
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel (M62 Specific)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out clean
          # اختيار الملف الصحيح لجهازك من القائمة التي صورتها
          make O=out exynos9820-f62_defconfig
          make O=out -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_KSU_Next
          path: out/arch/arm64/boot/Image*
          

name: Build KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl

      - name: Setup KernelSU Next (Direct Method)
        run: |
          # دمج الملفات مباشرة في السورس
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          # تحويله لنسخة Next إذا لزم الأمر أو الاستمرار مع المستقر
          
      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          # تنظيف وبناء
          make O=out clean
          make O=out exynos9820_defconfig
          make O=out -j$(nproc)

      - name: Check Output
        run: ls -R out/arch/arm64/boot/

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image
          path: out/arch/arm64/boot/Image*
          

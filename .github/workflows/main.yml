name: Build KernelSU Next M62 EvolutionX Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl git

      - name: Setup KSU Next (Advanced Patching)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd drivers/kernelsu
          git fetch --tags
          git checkout v3.0.1
          
          # --- الإصلاح الجذري لمشكلة TWA_RESUME ---
          # هذا الأمر يحذف السطر الذي يسبب الخطأ ويستبدله بكود متوافق مع كيرنال 4.14
          sed -i 's/task_work_add(tsk, cb, TWA_RESUME)/task_work_add(tsk, cb, true)/g' allowlist.c
          # في حال فشل الاستبدال الأول، هذا الأمر يقوم بتعريف القيمة يدوياً في ملف الترويسة الرئيسي
          echo "#define TWA_RESUME 1" >> ksu.h
          cd ../..

      - name: Build Kernel (M62 EvolutionX)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out clean
          make O=out exynos9820-f62_defconfig
          
          # تفعيل الميزات اللازمة لضمان إقلاع الروم المعدل
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # بناء الكيرنال مع تجاهل صارم للتحذيرات لضمان عبور أندرويد 16
          make O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-incompatible-pointer-types" -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_Next_EvoX_Final
          path: out/arch/arm64/boot/Image*
          

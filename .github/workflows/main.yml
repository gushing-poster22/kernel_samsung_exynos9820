name: Build KernelSU Next M62 EvolutionX Final-v7
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl git

      - name: Setup KSU Next (Extreme Patching)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          # الانتقال لمجلد الروت للإصلاحات الخاصة به
          cd drivers/kernelsu
          git fetch --tags
          git checkout v3.0.1
          
          # إصلاح seccomp ومسارات الـ Header
          sed -i '/seccomp.filter_count/s/^/\/\//' app_profile.c
          sed -i 's/<linux\/pgtable.h>/<asm\/pgtable.h>/g' sucompat.c
          sed -i 's/handle_inode_event/handle_event/g' pkg_observer.c
          cd ../..

          # إصلاح شامل لكل ملفات الكيرنال (بما فيها مجلد net) لتعريف المتغيرات الناقصة
          # هذا هو الحل الجذري لمشكلة السطر 2800 وأي مكان آخر يظهر فيه
          find . -name "*.c" -exec sed -i '1i #define TWA_RESUME 1' {} +
          find . -name "*.c" -exec sed -i '1i #define TWA_SIGNAL 0' {} +

      - name: Build Kernel (The Final Push)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out clean
          make O=out exynos9820-f62_defconfig
          
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # إضافة المزيد من الأعلام لتجاهل أخطاء التنسيق والشبكات (صور 2587 و 2590)
          make O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-function -Wno-implicit-fallthrough -Wno-return-type -Wno-unused-label -Wno-parentheses -Wno-format-extra-args -Wno-format -Wno-int-conversion" -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_EvoX_A16_Final_V7
          path: out/arch/arm64/boot/Image*
          

name: Build KernelSU Next EvolutionX Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl git

      - name: Setup KSU Next (v3.0.1 with A16 Patch)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd drivers/kernelsu
          git fetch --tags
          git checkout v3.0.1
          
          # --- حقن التعريفات المفقودة (The Surgical Patch) ---
          # إضافة تعريف TWA_RESUME يدوياً ليتوافق مع أندرويد 16 وكيرنال 4.14
          sed -i '1s/^/#define TWA_RESUME 1\n/' allowlist.c
          sed -i '1s/^/#define TWA_SIGNAL 0\n/' allowlist.c
          cd ../..

      - name: Build Kernel (M62 EvolutionX)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out clean
          make O=out exynos9820-f62_defconfig
          
          # تفعيل الخيارات الضرورية لروم Evolution X
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # البناء مع تجاهل الأخطاء الصارمة لأندرويد 16
          make O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-incompatible-pointer-types" -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_EvoX_A16_Fixed
          path: out/arch/arm64/boot/Image*
          

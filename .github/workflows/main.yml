name: Build KernelSU Next M62 EvolutionX Final Strike
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl git

      - name: Setup KSU Next (Hard Patching)
        run: |
          # جلب نسخة Next الرسمية v3.0.1 التي طلبتها
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd drivers/kernelsu
          git fetch --tags
          git checkout v3.0.1
          
          # --- حل مشكلة TWA_RESUME نهائياً (إصلاح صورة 2566) ---
          # نقوم بتعريف القيمة في كل ملفات KSU لضمان عدم حدوث Error 1 مجدداً
          sed -i '1i #define TWA_RESUME 1' allowlist.c
          sed -i '1i #define TWA_SIGNAL 0' allowlist.c
          echo "#define TWA_RESUME 1" >> ksu.h
          cd ../..

      - name: Build Kernel (M62 EvolutionX Optimized)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out clean
          make O=out exynos9820-f62_defconfig
          
          # تفعيل ميزات دعم الرومات المعدلة وأندرويد 16
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # تجاوز أخطاء الشبكة (إصلاح صورة 2565) وأخطاء التعريفات
          make O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-function" -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_Next_v3.0.1_EvoX
          path: out/arch/arm64/boot/Image*
          

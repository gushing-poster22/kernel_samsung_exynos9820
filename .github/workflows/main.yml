name: Build KernelSU Next M62 EvolutionX Final-v10-Victory
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: vic

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64 curl git

      - name: Setup KSU Next (Ultimate Fixes)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd drivers/kernelsu
          git fetch --tags
          git checkout v3.0.1
          
          # إصلاحات التوافق (صور 2571، 2583، 2596)
          sed -i '/seccomp.filter_count/s/^/\/\//' app_profile.c
          sed -i 's/<linux\/pgtable.h>/<asm\/pgtable.h>/g' sucompat.c
          sed -i 's/handle_inode_event/handle_event/g' pkg_observer.c
          
          # حل مشكلة ملف mount.h الذي أوقفنا في الصورة 2596
          sed -i 's/<uapi\/linux\/mount.h>/<linux\/mount.h>/g' su_mount_ns.c
          cd ../..

          # الحقن الشامل لتعريفات TWA لضمان عبور مجلد lib و net (صورة 2588)
          find . -name "*.c" -exec sed -i '1i #define TWA_RESUME 1' {} +
          find . -name "*.c" -exec sed -i '1i #define TWA_SIGNAL 0' {} +

      - name: Build Kernel (The Final Output)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          
          make O=out clean
          make O=out exynos9820-f62_defconfig
          
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # بناء الكيرنال مع تجاهل تام للتحذيرات لسرعة الاستخراج
          make O=out KCFLAGS="-w -Wno-error -Wno-unused-result -Wno-int-conversion -fno-stack-protector" -j$(nproc)

      - name: Verify and Pack
        run: |
          # هذا السطر سيبحث عن الكيرنال في كل المجلدات الممكنة لضمان العثور عليه
          find out/arch/arm64/boot/ -name "Image*" -exec cp {} . \;
          if [ -f Image ]; then
            echo "CONGRATULATIONS: Kernel Image is Ready!"
          else
            echo "FAILED: Still missing the final link."
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M62_EvoX_Final_SUCCESS_V10
          path: Image*
          
